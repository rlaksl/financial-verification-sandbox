# Betterleaks v1.10.1 common scan configuration (D-O24, ADR-0001).
# v1 does not load this file automatically: always pass it with -c.
# Changing rules or adding allowlists weakens the scan: mark the PR as security-impacting.
# For pull requests, CI scans with this file from the base commit, not from the PR (D-O33).

title = "financial-verification-sandbox"

[extend]
# Keep all default detection rules.
useDefault = true

# Project test placeholder format. Tests use this format instead of realistic
# provider token formats, so detection can be exercised without real-looking credentials.
[[rules]]
id = "fvs-test-token"
description = "Financial Verification Sandbox test placeholder secret"
regex = '''fvs_test_[0-9a-f]{32}'''
keywords = ["fvs_test_"]
